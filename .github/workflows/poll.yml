name: Poll lottery listings

on:
  schedule:
    # Hourly. Change to */30 for 30-minute polling (uses more free-tier minutes).
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scraper/extractor/notifier
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py

      - name: Commit updated data and site
        run: |
          git config user.name "lottery-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db.sqlite3 docs/index.html
          git diff --cached --quiet || git commit -m "chore: update listings [skip ci]"
          git push
